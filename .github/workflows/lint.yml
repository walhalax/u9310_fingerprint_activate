name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -e
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 shellcheck
      - name: bashate (style)
        run: |
          pip install bashate
          bashate --error . || true